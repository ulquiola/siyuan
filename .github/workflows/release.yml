name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 3.8.9"
        required: true
        type: string

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "value=${tag}" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag}"

  build-windows:
    name: Build Windows package
    uses: ./.github/workflows/desktop-build.yml
    with:
      config: '{"os":"windows-latest","name":"windows build win.exe","kernel_path":"../app/kernel/SiYuan-Kernel.exe","build_args_prefix":"-s -w -X","build_args_suffix":"Mode=prod","electron_args":"dist","goos":"windows","gobin":"bin","goarch":"amd64","suffix":"win.exe","e2e_shards":""}'
      packageManager: pnpm@12.6.0

  build-macos:
    name: Build macOS Intel package
    uses: ./.github/workflows/desktop-build.yml
    with:
      config: '{"os":"macos-latest","name":"macos build mac.dmg","kernel_path":"../app/kernel-darwin/SiYuan-Kernel","build_args_prefix":"-s -w -X","build_args_suffix":"Mode=prod","electron_args":"dist-darwin-unsigned","goos":"darwin","goarch":"amd64","suffix":"mac.dmg","e2e_shards":""}'
      packageManager: pnpm@12.6.0

  build-macos-arm64:
    name: Build macOS Apple Silicon package
    # macOS 运行器并发有限，两个 macOS 任务串行执行，避免后一个在排队中被取消
    needs: build-macos
    uses: ./.github/workflows/desktop-build.yml
    with:
      config: '{"os":"macos-latest","name":"macos build mac-arm64.dmg","kernel_path":"../app/kernel-darwin-arm64/SiYuan-Kernel","build_args_prefix":"-s -w -X","build_args_suffix":"Mode=prod","electron_args":"dist-darwin-arm64-unsigned","goos":"darwin","goarch":"arm64","suffix":"mac-arm64.dmg","e2e_shards":""}'
      packageManager: pnpm@12.6.0

  publish:
    name: Publish release
    needs: [prepare, build-windows, build-macos, build-macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: siyuan-*
          path: assets
          merge-multiple: true

      - name: Prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          ls -l
          test -s "$(find . -maxdepth 1 -name 'siyuan-*-win.exe' | head -1)"
          test -s "$(find . -maxdepth 1 -name 'siyuan-*-mac.dmg' | head -1)"
          test -s "$(find . -maxdepth 1 -name 'siyuan-*-mac-arm64.dmg' | head -1)"
          sha256sum siyuan-*-win.exe siyuan-*-mac.dmg siyuan-*-mac-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<EOF
          基于上游 ${RELEASE_TAG} 的自用构建。

          - 移除设置中的账户与订阅入口
          - 第三方同步不依赖社区账号和付费校验，修复未登录时同步和云端快照下载无响应的问题
          - 桌面版内核内置 Tailscale（tsnet），可在 设置 - 应用 - Tailscale 中启用并查看状态，无需管理员权限即可通过本机 SOCKS5 代理访问 Tailnet
          - 内嵌 Tailscale 的控制面连接绕过自身 SOCKS 代理，修复节点无法上线导致的同步失败
          - 应用内的检查更新、自动下载安装包和下载链接都指向本仓库的 GitHub Releases
          - Docker 构建适配国内网络与 amd64 原生编译

          资产：

          - \`siyuan-<版本>-win.exe\`：Windows x64 安装包
          - \`siyuan-<版本>-mac.dmg\`：macOS Intel 安装包
          - \`siyuan-<版本>-mac-arm64.dmg\`：macOS Apple Silicon 安装包
          - \`SHA256SUMS.txt\`：SHA-256 校验值

          macOS 安装包未签名，首次打开需要在 系统设置 - 隐私与安全性 中允许，或执行 \`xattr -cr /Applications/SiYuan.app\`。
          EOF
          cat RELEASE_NOTES.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" assets/* --title "SiYuan ${RELEASE_TAG} 自用版" --notes-file RELEASE_NOTES.md --prerelease
          else
            gh release create "$RELEASE_TAG" assets/* --title "SiYuan ${RELEASE_TAG} 自用版" --notes-file RELEASE_NOTES.md --latest
          fi

      - name: Verify assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = "4"
          for attempt in {1..12}; do
            READY=true
            for file in assets/siyuan-*; do
              name="$(basename "$file")"
              local_digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
              remote_digest="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" --jq ".assets[] | select(.name == \"${name}\") | .digest")"
              if [ "$local_digest" != "$remote_digest" ]; then
                READY=false
                break
              fi
            done
            if [ "$READY" = true ]; then
              echo "release assets verified"
              exit 0
            fi
            sleep 10
          done
          echo "release assets were not verified in time"
          exit 1