name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 3.8.8"
        required: true
        type: string

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "value=${tag}" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag}"

  build:
    name: Build Windows package
    uses: ./.github/workflows/desktop-build.yml
    with:
      config: '{"os":"windows-latest","name":"windows build win.exe","kernel_path":"../app/kernel/SiYuan-Kernel.exe","build_args_prefix":"-s -w -X","build_args_suffix":"Mode=prod","electron_args":"dist","goos":"windows","gobin":"bin","goarch":"amd64","suffix":"win.exe","e2e_shards":""}'
      packageManager: pnpm@12.6.0

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: siyuan-win.exe
          path: assets

      - name: Prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          ls -l
          test "$(find . -maxdepth 1 -name 'siyuan-*-win.exe' | wc -l)" = "1"
          sha256sum siyuan-*-win.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          name: SiYuan ${{ needs.prepare.outputs.tag }} 自用版
          body: |
            基于上游 ${{ needs.prepare.outputs.tag }} 的自用构建。

            - 移除设置中的账户与订阅入口
            - 第三方同步的付费校验直接放行
            - 桌面版内核内置 Tailscale（tsnet），可在 设置 - 应用 - Tailscale 中启用并查看状态，无需管理员权限即可通过本机 SOCKS5 代理访问 Tailnet
            - Docker 构建适配国内网络与 amd64 原生编译

            资产为 `siyuan-<版本>-win.exe`（Windows x64）与 `SHA256SUMS.txt`。
          artifacts: "assets/*"
          draft: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          allowUpdates: true
          omitDraftDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true"
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = "2"
          gh release edit "$RELEASE_TAG" --draft=false